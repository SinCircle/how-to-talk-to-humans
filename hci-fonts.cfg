%% =====================================================================
%%  hci-fonts.cfg — 字体配置（Windows / TeX Live 2026 / XeLaTeX）
%%  用文件路径而非字体名，避免系统字体注册表差异；文件均已在本机核实存在。
%%  如需换字体，只改这个文件即可。
%% =====================================================================

%% ---- 中文 ----
% 正文：思源宋体（Source Han Serif / Noto Serif SC），正式出版物的中文衬线体。
% 可变字重字体，用 FontFace 指定 weight 轴上的不同实例。
\setCJKmainfont{NotoSerifSC-VF.ttf}[
  Path = C:/Windows/Fonts/,
  BoldFont = NotoSansSC-VF.ttf,
  ItalicFont = STKAITI.TTF,
  BoldItalicFont = NotoSansSC-VF.ttf
]
% 标题 / 强调：思源黑体
\setCJKsansfont{NotoSansSC-VF.ttf}[Path = C:/Windows/Fonts/]
% 等宽环境里的中文：黑体
\setCJKmonofont{simhei.ttf}[Path = C:/Windows/Fonts/]

%% ---- 西文 ----
% 正文西文：Times New Roman（与宋体搭配，书籍常规）
\setmainfont{times.ttf}[
  Path = C:/Windows/Fonts/,
  BoldFont = timesbd.ttf,
  ItalicFont = timesi.ttf,
  BoldItalicFont = timesbi.ttf
]
% 无衬线：Segoe UI
\setsansfont{segoeui.ttf}[
  Path = C:/Windows/Fonts/,
  BoldFont = segoeuib.ttf,
  ItalicFont = segoeuii.ttf,
  BoldItalicFont = segoeuiz.ttf
]
% 等宽：Consolas
\setmonofont{consola.ttf}[
  Path = C:/Windows/Fonts/,
  BoldFont = consolab.ttf,
  ItalicFont = consolai.ttf,
  BoldItalicFont = consolaz.ttf,
  Scale = 0.94
]

%% ---- 中文标点：全角，保持书籍的整齐感 ----
\xeCJKsetup{CheckSingle = true}
\punctstyle{quanjiao}
